<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="letter-c.png" type="image/x-icon">
    <title>Cybexgpt 1.0</title>
    <link rel="stylesheet" href="Aistyle.css">
</head>
<body>
    <header>
        <p style="font-weight: bold; font-size: 40px;">Cybexhark AI Assistant</p>
        <p style="font-size: 15px;">(Cybexgpt 1.0)</p>
    </header>
    <main>
        <div id="chat-container">
            <!-- Chat messages will be dynamically added here -->
        </div>
        <form id="questionForm">
            <input type="text" id="question" placeholder="Ask your gym-related question..." required>
            <button type="submit"><img src="paper-plane.png" width="15px" height="15px"></button>
        </form>
    </main>
    <footer>For inquiries, click the logos below.</footer>

    <script>
        document.getElementById('questionForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const question = document.getElementById('question').value.trim();
            if (question) {
                handleQuestion(question);
                document.getElementById('question').value = ''; // Clear input
            }
        });

        function addMessage(sender, text) {
            const chatContainer = document.getElementById('chat-container');
            const messageElement = document.createElement('div');
            messageElement.className = `chat-message ${sender}`;
            messageElement.innerHTML = `
                <img src="${sender === 'user' ? 'laid.jpg' : 'letter-c.png'}" alt="${sender}">
                <p>${text}</p>
            `;
            chatContainer.appendChild(messageElement);
            chatContainer.scrollTop = chatContainer.scrollHeight; // Scroll to latest message
        }

        function showLoading() {
            const chatContainer = document.getElementById('chat-container');
            const loadingElement = document.createElement('div');
            loadingElement.id = 'loading';
            loadingElement.className = 'chat-message bot';
            loadingElement.innerHTML = `
                <img src="letter-c.png" alt="bot">
                <p><span>.</span><span>.</span><span>.</span></p>
            `;
            chatContainer.appendChild(loadingElement);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function hideLoading() {
            const loadingElement = document.getElementById('loading');
            if (loadingElement) {
                loadingElement.remove();
            }
        }

        async function handleQuestion(question) {
            addMessage('user', question); // Add user message
            showLoading(); // Show "thinking" animation

            try {
                const responseText = await fetchAIResponse(question); // Fetch AI response
                addMessage('bot', responseText); // Add bot message
            } catch (error) {
                console.error("Error fetching AI response:", error);
                addMessage('bot', "Sorry, I couldn't process your request. Please try again.");
            } finally {
                hideLoading(); // Hide loading animation
            }
        }

        async function fetchAIResponse(question) {
            const apiUrl = "https://your-live-backend-url.com/api/chat"; // Replace with your live backend URL

            try {
                const response = await fetch(apiUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ message: question })
                });

                if (!response.ok) {
                    throw new Error(`Backend error: ${response.statusText}`);
                }

                const data = await response.json();
                return data.reply; // Return the AI reply
            } catch (error) {
                console.error("Error communicating with backend:", error);
                throw error;
            }
        }
    </script>
</body>
</html>
